[project]
name = "blot-git"
version = "0.0.1"
description = "A pre-commit check that has read your project's history: warns when a change removes a fix, re-adds a fixed bug, or forgets a file that always changes too."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # core is stdlib-only: fast hook startup, trivial install

[project.urls]
Homepage = "https://github.com/Sym-jay/Blot"
Issues = "https://github.com/Sym-jay/Blot/issues"

[project.optional-dependencies]
github = []        # PR/issue enrichment uses the `gh` CLI or urllib; no extra deps planned
dev = ["pytest>=8"]

[project.scripts]
blot = "blot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
